<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>techpay__ tools</title>
<meta name="description" content="Tools that make or save money for small businesses and side hustles.">
<style>
  :root { color-scheme: dark; --bg:#0B0D11; --card:#151922; --line:#232937;
           --fg:#EAF0F7; --muted:#95A1B3; --accent:#3DDC97; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
          font:16px/1.55 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 18px 72px; }
  h1 { font-size:26px; margin:0 0 6px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 28px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  .card a { display:block; text-decoration:none; color:inherit; background:var(--card);
             border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card a:hover { border-color:var(--accent); }
  .name { font-weight:700; font-size:18px; }
  .tag { float:right; font:600 11px/1.9 ui-monospace, SFMono-Regular, monospace;
          letter-spacing:.12em; color:var(--accent); }
  .card p { margin:6px 0 10px; color:var(--muted); }
  .go { font-size:14px; color:var(--accent); }
  .empty { background:none; border:1px dashed var(--line); border-radius:14px; padding:20px; }
  footer { margin-top:36px; color:var(--muted); font-size:13px; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>@techpay__</h1>
  <p class="sub">Tools that make or save money for small businesses and side hustles. Every tool from the videos, newest first.</p>
  <ul>
      <li class="card empty"><p>First tools land here as soon as the videos go out.</p></li>
  </ul>
  <footer>
    <a href="https://tiktok.com/@techpay__">TikTok</a> · updated Sep 22, 2026
  </footer>
</main>
</body>
</html>
